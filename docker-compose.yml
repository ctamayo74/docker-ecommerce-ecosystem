name: ecommerce

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?define MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?define MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER:?define MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?define MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    # Sin "ports": 3306 solo es alcanzable desde la red interna
    networks: [backend-net]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: ./backend
    image: ecommerce-backend:latest
    restart: unless-stopped
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?define APP_KEY}
      APP_URL: ${APP_URL:-http://localhost:8000}
      LOG_CHANNEL: stderr
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE}
      DB_USERNAME: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      STRIPE_SECRET: ${STRIPE_SECRET:-}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-false}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8000}:80"   # opcional: el frontend usa la red interna
    security_opt: ["no-new-privileges:true"]
    networks: [backend-net, frontend-net]

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_STRIPE_KEY: ${NEXT_PUBLIC_STRIPE_KEY:?define NEXT_PUBLIC_STRIPE_KEY}
    image: ecommerce-frontend:latest
    restart: unless-stopped
    environment:
      API_URL: ${API_URL:-http://backend/api}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    networks: [frontend-net]

networks:
  # El frontend nunca ve la base de datos
  backend-net:
    internal: true
  frontend-net:

volumes:
  mysql_data:
